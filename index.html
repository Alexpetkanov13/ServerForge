<!doctype html>
<html lang="en" class="dark" data-theme="ember" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServerForge</title>
    <script>
      (() => {
        const themes = {
          ember: { background: "oklch(0.16 0.018 48)", card: "oklch(0.2 0.02 48)", foreground: "oklch(0.97 0.01 80)", muted: "oklch(0.27 0.018 48)", mutedForeground: "oklch(0.74 0.03 70)", primary: "oklch(0.78 0.15 55)", glow: "oklch(0.45 0.12 55 / 0.28)" },
          midnight: { background: "oklch(0.17 0.025 260)", card: "oklch(0.21 0.03 260)", foreground: "oklch(0.94 0.015 250)", muted: "oklch(0.25 0.025 260)", mutedForeground: "oklch(0.72 0.04 260)", primary: "oklch(0.72 0.14 250)", glow: "oklch(0.5 0.14 250 / 0.3)" },
          forest: { background: "oklch(0.16 0.02 155)", card: "oklch(0.2 0.03 155)", foreground: "oklch(0.94 0.015 155)", muted: "oklch(0.24 0.025 155)", mutedForeground: "oklch(0.74 0.04 155)", primary: "oklch(0.75 0.16 155)", glow: "oklch(0.55 0.15 155 / 0.3)" },
          light: { background: "oklch(1 0 0)", card: "oklch(1 0 0)", foreground: "oklch(0.145 0 0)", muted: "oklch(0.97 0 0)", mutedForeground: "oklch(0.556 0 0)", primary: "oklch(0.205 0 0)", glow: "transparent" },
          amethyst: { background: "oklch(0.15 0.035 300)", card: "oklch(0.2 0.04 300)", foreground: "oklch(0.95 0.015 300)", muted: "oklch(0.27 0.035 300)", mutedForeground: "oklch(0.75 0.05 300)", primary: "oklch(0.76 0.18 300)", glow: "oklch(0.55 0.2 300 / 0.3)" },
          ocean: { background: "oklch(0.16 0.03 220)", card: "oklch(0.2 0.04 220)", foreground: "oklch(0.95 0.015 210)", muted: "oklch(0.25 0.03 220)", mutedForeground: "oklch(0.74 0.05 210)", primary: "oklch(0.78 0.14 205)", glow: "oklch(0.55 0.16 205 / 0.3)" },
          synthwave: { background: "oklch(0.14 0.04 320)", card: "oklch(0.2 0.055 320)", foreground: "oklch(0.96 0.02 330)", muted: "oklch(0.26 0.045 320)", mutedForeground: "oklch(0.76 0.06 330)", primary: "oklch(0.77 0.2 340)", glow: "oklch(0.55 0.22 340 / 0.3)" },
          graphite: { background: "oklch(0.16 0.008 260)", card: "oklch(0.21 0.01 260)", foreground: "oklch(0.94 0.006 260)", muted: "oklch(0.27 0.008 260)", mutedForeground: "oklch(0.7 0.01 260)", primary: "oklch(0.78 0.01 260)", glow: "oklch(0.55 0.02 260 / 0.2)" }
        };
        const selected = localStorage.getItem("serverforge:theme");
        const theme = selected && themes[selected] ? selected : "ember";
        const palette = themes[theme];
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.classList.toggle("dark", theme !== "light");
        root.style.colorScheme = theme === "light" ? "light" : "dark";
        root.style.setProperty("--background", palette.background);
        root.style.setProperty("--card", palette.card);
        root.style.setProperty("--foreground", palette.foreground);
        root.style.setProperty("--muted", palette.muted);
        root.style.setProperty("--muted-foreground", palette.mutedForeground);
        root.style.setProperty("--primary", palette.primary);
        root.style.setProperty("--sf-glow-1", palette.glow);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
